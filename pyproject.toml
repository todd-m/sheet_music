[project]
name = "sheet-music-library"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "env/*", ".venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
